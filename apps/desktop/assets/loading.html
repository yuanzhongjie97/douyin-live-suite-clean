<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 20% 15%, rgba(34, 197, 94, 0.26), transparent 28%),
          radial-gradient(circle at 82% 20%, rgba(14, 165, 233, 0.24), transparent 32%),
          linear-gradient(135deg, #0f172a 0%, #122033 52%, #16251d 100%);
        color: #ecfeff;
        overflow: hidden;
      }
      .card {
        width: 420px;
        padding: 34px 36px 30px;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.76);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(18px);
      }
      .logo-shell {
        position: relative;
        width: 92px;
        height: 92px;
        display: grid;
        place-items: center;
        margin-bottom: 20px;
        border-radius: 30px;
        background: linear-gradient(145deg, rgba(34, 197, 94, 0.28), rgba(103, 232, 249, 0.12));
        box-shadow: 0 22px 54px rgba(0, 0, 0, 0.32), 0 0 42px rgba(34, 197, 94, 0.2);
        overflow: hidden;
      }
      .logo-shell::before {
        content: '';
        position: absolute;
        inset: -34%;
        background: conic-gradient(from 0deg, transparent 0deg, rgba(103, 232, 249, 0.75) 72deg, transparent 138deg, rgba(34, 197, 94, 0.62) 218deg, transparent 300deg);
        animation: logoSpin 5.2s linear infinite;
      }
      .logo-shell::after {
        content: '';
        position: absolute;
        inset: 4px;
        border-radius: 27px;
        background: rgba(15, 23, 42, 0.92);
      }
      .logo {
        position: relative;
        z-index: 1;
        width: 76px;
        height: 76px;
        border-radius: 24px;
        object-fit: cover;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 16px 30px rgba(0, 0, 0, 0.28);
      }
      .logo-sheen {
        position: absolute;
        z-index: 2;
        width: 38px;
        height: 140px;
        transform: rotate(22deg) translateX(-120px);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.34), transparent);
        animation: logoSheen 2.8s ease-in-out infinite;
      }
      .brand { font-size: 24px; font-weight: 800; letter-spacing: 0.08em; }
      .subtitle { margin-top: 10px; color: rgba(226, 232, 240, 0.76); font-size: 13px; }
      .bar {
        position: relative;
        height: 12px;
        margin-top: 28px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(148, 163, 184, 0.18);
      }
      .fill {
        width: 6%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #22c55e, #67e8f9);
        box-shadow: 0 0 24px rgba(103, 232, 249, 0.46);
        transition: width 260ms ease;
      }
      .meta { display: flex; justify-content: space-between; gap: 14px; margin-top: 14px; }
      .status { color: rgba(226, 232, 240, 0.86); font-size: 13px; }
      .percent { color: #a7f3d0; font-size: 13px; font-weight: 800; }
      .error { color: #fecaca; }
      @keyframes logoSpin { to { transform: rotate(360deg); } }
      @keyframes logoSheen { 0%, 42% { transform: rotate(22deg) translateX(-120px); } 72%, 100% { transform: rotate(22deg) translateX(120px); } }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo-shell"><img class="logo" src="app-logo-loading.png" alt="糖三角 Logo" /><span class="logo-sheen"></span></div>
      <div class="brand">糖三角</div>
      <div class="subtitle">正在启动...</div>
    </main>
  </body>
</html>
